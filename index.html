<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Bus Live Tracking System - Login</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #080d1a; color: #f1f5f9; }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .leaflet-tile-pane { filter: brightness(0.8) contrast(1.2) invert(0.9) hue-rotate(190deg); }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #1e293b !important; color: #f8fafc !important; }
    @keyframes signal-pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .live-pulse { animation: signal-pulse 2s infinite; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- React 18 & Babel Standalone CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = '/api';
    const WS_PROTOCOL = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const WS_BASE = `${WS_PROTOCOL}//${window.location.host}/ws`;

    // --- Starting Login Page Component ---
    function LoginPage({ onLoginSuccess }) {
      const [email, setEmail] = useState('student@college.edu');
      const [password, setPassword] = useState('student123');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleLoginSubmit = async (e, customEmail = null, customPass = null) => {
        if (e) e.preventDefault();
        setError('');
        setLoading(true);

        const targetEmail = customEmail || email;
        const targetPass = customPass || password;

        try {
          const res = await fetch(`${API_BASE}/auth/token`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: targetEmail, password: targetPass })
          });

          if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.detail || 'Invalid email or password');
          }

          const data = await res.json();
          localStorage.setItem('jwt_token', data.access_token);
          localStorage.setItem('user_role', data.role);
          localStorage.setItem('user_name', data.name);
          onLoginSuccess(data);
        } catch (err) {
          setError(err.message || 'Login failed. Please check credentials.');
        } finally {
          setLoading(false);
        }
      };

      const handleQuickLogin = (role) => {
        if (role === 'student') {
          setEmail('student@college.edu');
          setPassword('student123');
          handleLoginSubmit(null, 'student@college.edu', 'student123');
        } else if (role === 'driver') {
          setEmail('driver@college.edu');
          setPassword('driver123');
          handleLoginSubmit(null, 'driver@college.edu', 'driver123');
        } else if (role === 'admin') {
          onLoginSuccess({ role: 'admin', name: 'System Administrator' });
        }
      };

      return (
        <div className="min-h-screen w-full flex items-center justify-center p-4 bg-gradient-to-br from-[#060a12] via-[#0b1329] to-[#080d1a] relative overflow-hidden">
          <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
          <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

          <div className="glass-panel w-full max-w-md p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6 relative z-10">
            <div className="text-center space-y-2">
              <div className="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-cyan-500 to-emerald-400 p-0.5 shadow-xl shadow-cyan-500/20">
                <div className="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center text-3xl">
                  🚌
                </div>
              </div>
              <h1 className="text-2xl font-black text-white tracking-tight mt-3">
                COLLEGE BUS <span className="text-cyan-400 font-mono">LIVE TRACKER</span>
              </h1>
              <p className="text-xs text-slate-400">
                Karad City to ABIT Polytechnic Satara (via NH48)
              </p>
            </div>

            {error && (
              <div className="p-3 bg-red-500/10 border border-red-500/30 text-red-400 rounded-xl text-xs font-semibold text-center">
                {error}
              </div>
            )}

            <form onSubmit={handleLoginSubmit} className="space-y-4">
              <div>
                <label className="text-xs font-semibold text-slate-300 block mb-1">Email Address</label>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="name@college.edu"
                  className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-cyan-500 focus:outline-none transition-colors"
                />
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-300 block mb-1">Password</label>
                <input
                  type="password"
                  required
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="••••••••"
                  className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-cyan-500 focus:outline-none transition-colors"
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full py-3 bg-gradient-to-r from-cyan-500 to-emerald-400 hover:from-cyan-400 hover:to-emerald-300 text-slate-950 font-extrabold text-sm rounded-xl shadow-lg shadow-cyan-500/20 transition-all"
              >
                {loading ? 'Authenticating...' : 'Sign In to Tracker'}
              </button>
            </form>

            <div className="pt-4 border-t border-slate-800/80 space-y-3">
              <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block text-center">
                ⚡ 1-Click Hackathon Quick Demo Logins
              </span>
              <div className="grid grid-cols-3 gap-2">
                <button
                  type="button"
                  onClick={() => handleQuickLogin('student')}
                  className="py-2.5 px-2 bg-slate-900 hover:bg-slate-800 text-cyan-400 border border-slate-800 rounded-xl text-xs font-bold transition-all text-center"
                >
                  🎓 Student
                </button>
                <button
                  type="button"
                  onClick={() => handleQuickLogin('driver')}
                  className="py-2.5 px-2 bg-slate-900 hover:bg-slate-800 text-emerald-400 border border-slate-800 rounded-xl text-xs font-bold transition-all text-center"
                >
                  🚌 Driver
                </button>
                <button
                  type="button"
                  onClick={() => handleQuickLogin('admin')}
                  className="py-2.5 px-2 bg-slate-900 hover:bg-slate-800 text-purple-400 border border-slate-800 rounded-xl text-xs font-bold transition-all text-center"
                >
                  ⚙️ Admin
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- Leaflet Map Component ---
    function LeafletMap({ busLocation, routeStops, busNumber }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const busMarkerRef = useRef(null);
      const defaultCenter = [17.4015, 74.1030];

      useEffect(() => {
        if (!mapContainerRef.current) return;
        if (!mapInstanceRef.current) {
          const map = L.map(mapContainerRef.current, { center: defaultCenter, zoom: 11, zoomControl: false });
          L.control.zoom({ position: 'bottomright' }).addTo(map);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);
          mapInstanceRef.current = map;
        }

        const map = mapInstanceRef.current;
        if (routeStops && routeStops.length > 0) {
          const polylineCoords = routeStops.map(s => [s.latitude, s.longitude]);
          map.eachLayer((layer) => {
            if (layer instanceof L.Polyline || (layer instanceof L.Marker && layer !== busMarkerRef.current)) {
              map.removeLayer(layer);
            }
          });

          L.polyline(polylineCoords, { color: '#06b6d4', weight: 6, opacity: 0.85 }).addTo(map);
          map.fitBounds(L.latLngBounds(polylineCoords), { padding: [35, 35] });

          routeStops.forEach((stop, idx) => {
            const isCollege = idx === routeStops.length - 1;
            const iconHtml = isCollege
              ? `<div class="bg-amber-500 text-slate-950 p-2 rounded-full border-2 border-white shadow-lg text-lg flex items-center justify-center w-10 h-10">🏫</div>`
              : `<div class="bg-emerald-500 text-white p-1 rounded-full border-2 border-white shadow-md text-xs flex items-center justify-center w-6 h-6 font-bold">${stop.stop_order}</div>`;
            const customIcon = L.divIcon({ className: 'custom-stop', html: iconHtml, iconSize: isCollege ? [40, 40] : [24, 24] });
            L.marker([stop.latitude, stop.longitude], { icon: customIcon }).addTo(map).bindPopup(`<div class="p-1"><h4 class="font-bold text-white text-sm">${stop.stop_name}</h4><p class="text-xs text-slate-300">Stop #${stop.stop_order}</p></div>`);
          });
        }
      }, [routeStops]);

      useEffect(() => {
        if (!mapInstanceRef.current || !busLocation) return;
        const map = mapInstanceRef.current;
        const { latitude, longitude, speed } = busLocation;
        const busIcon = L.divIcon({ className: 'custom-bus', html: `<div class="relative bg-emerald-500 text-slate-950 p-2 rounded-full border-2 border-white shadow-2xl text-xl flex items-center justify-center w-10 h-10">🚌</div>`, iconSize: [48, 48] });

        if (!busMarkerRef.current) {
          busMarkerRef.current = L.marker([latitude, longitude], { icon: busIcon }).addTo(map);
        } else {
          busMarkerRef.current.setLatLng([latitude, longitude]);
        }
        map.panTo([latitude, longitude], { animate: true, duration: 1.0 });
      }, [busLocation]);

      return <div ref={mapContainerRef} className="w-full h-full min-h-[500px] rounded-xl overflow-hidden shadow-2xl border border-slate-800" />;
    }

    // --- Student App Component ---
    function StudentApp() {
      const [routes, setRoutes] = useState([]);
      const [selectedRouteId, setSelectedRouteId] = useState(null);
      const [busLocation, setBusLocation] = useState({
        bus_id: 2,
        latitude: 17.2833,
        longitude: 74.1825,
        speed: 55.0,
        current_stop: "Karad Central Bus Stand (CBS)",
        next_stop: "Karad NH48 Highway Flyover Junction",
        eta_minutes: 5,
        distance_remaining_km: 43.8,
        timestamp: new Date().toISOString()
      });
      const [wsConnected, setWsConnected] = useState(false);
      const [selectedStopId, setSelectedStopId] = useState(null);

      useEffect(() => {
        fetch(`${API_BASE}/routes`).then(r => r.json()).then(data => {
          if (data && data.length > 0) {
            setRoutes(data);
            const karadRoute = data.find(r => r.route_name.includes("NH48") || r.route_name.includes("Karad")) || data[0];
            setSelectedRouteId(karadRoute.id);
            if (karadRoute.stops.length > 1) {
              setSelectedStopId(karadRoute.stops[1].id);
            }
          }
        }).catch(console.error);
      }, []);

      const activeRoute = routes.find(r => r.id === Number(selectedRouteId)) || routes[0];
      const busId = activeRoute && (activeRoute.route_name.includes("Karad") || activeRoute.route_name.includes("NH48")) ? 2 : 1;
      const busName = busId === 2 ? "BUS-12 (MH-11-AB-2012)" : "BUS-05 (MH-09-CB-1005)";
      const driverName = busId === 2 ? "Suresh Deshmukh" : "Rajesh Patil";

      useEffect(() => {
        const ws = new WebSocket(`${WS_BASE}/student/${busId}`);
        ws.onopen = () => setWsConnected(true);
        ws.onmessage = (e) => { setBusLocation(JSON.parse(e.data)); setWsConnected(true); };
        ws.onclose = () => setWsConnected(false);
        return () => ws.close();
      }, [busId]);

      const currentStops = activeRoute ? activeRoute.stops : [];

      return (
        <div className="space-y-6">
          <div className="glass-panel p-4 rounded-xl flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center space-x-3">
              <div className="p-3 bg-emerald-500/20 text-emerald-400 rounded-lg border border-emerald-500/30 text-2xl">🛣️</div>
              <div>
                <div className="flex items-center space-x-2">
                  <select
                    value={selectedRouteId || ''}
                    onChange={(e) => setSelectedRouteId(Number(e.target.value))}
                    className="bg-slate-900 text-white font-bold text-lg border border-slate-800 rounded-lg px-2.5 py-1 focus:outline-none focus:border-cyan-500 cursor-pointer"
                  >
                    {routes.map(r => (
                      <option key={r.id} value={r.id}>{r.route_name}</option>
                    ))}
                  </select>
                  <span className={`text-xs px-2.5 py-0.5 rounded-full font-semibold ${wsConnected ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-amber-500/20 text-amber-400'}`}>
                    {wsConnected ? 'LIVE WEBSOCKET STREAMING' : 'CONNECTING...'}
                  </span>
                </div>
                <p className="text-xs text-slate-400 mt-1">
                  Assigned Bus: <span className="text-white font-semibold">{busName}</span> • Driver: <span className="text-white font-semibold">{driverName}</span>
                </p>
              </div>
            </div>

            <div className="flex items-center space-x-3 bg-slate-900/80 p-2 rounded-lg border border-slate-800">
              <span className="text-cyan-400">📍</span>
              <div>
                <label className="text-[10px] text-slate-400 uppercase font-semibold block">My Boarding Stop</label>
                <select
                  value={selectedStopId || ''}
                  onChange={(e) => setSelectedStopId(Number(e.target.value))}
                  className="bg-transparent text-white font-semibold text-sm cursor-pointer focus:outline-none"
                >
                  {currentStops.map(s => (
                    <option key={s.id} value={s.id} className="bg-slate-900">
                      Stop #{s.stop_order}: {s.stop_name}
                    </option>
                  ))}
                </select>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="space-y-6">
              <div className="glass-panel p-6 rounded-xl border-l-4 border-l-cyan-500">
                <span className="text-xs font-semibold text-cyan-400 uppercase tracking-wider">Estimated Time of Arrival</span>
                <h3 className="text-4xl font-black text-white mt-1 flex items-baseline gap-2">
                  {busLocation.eta_minutes || 5} <span className="text-lg font-normal text-slate-400">mins</span>
                </h3>
                <div className="mt-4 pt-4 border-t border-slate-800 grid grid-cols-2 gap-4 text-xs">
                  <div>
                    <span className="text-slate-400 block">Current Speed</span>
                    <span className="text-base font-bold text-emerald-400">{(busLocation.speed || 55.0).toFixed(1)} km/h</span>
                  </div>
                  <div>
                    <span className="text-slate-400 block">Distance Remaining</span>
                    <span className="text-base font-bold text-cyan-400">{busLocation.distance_remaining_km || 43.8} km</span>
                  </div>
                </div>
              </div>

              <div className="glass-panel p-5 rounded-xl space-y-4">
                <h4 className="text-sm font-bold text-white uppercase tracking-wider flex items-center justify-between">
                  <span>Route Timeline</span>
                  <span className="text-xs font-normal text-cyan-400 font-mono">NH48 Highway</span>
                </h4>
                <div className="relative pl-6 space-y-4 border-l-2 border-slate-800 max-h-[380px] overflow-y-auto pr-1">
                  {currentStops.map((stop, idx) => {
                    const isCollege = idx === currentStops.length - 1;
                    const isCurrent = busLocation.current_stop === stop.stop_name || (idx === 0 && !busLocation.current_stop);
                    return (
                      <div key={stop.id} className="relative flex items-start space-x-3">
                        <div className={`absolute -left-[31px] top-0.5 w-4 h-4 rounded-full border-2 ${isCurrent ? 'bg-emerald-500 border-white ring-4 ring-emerald-500/20' : isCollege ? 'bg-amber-500 border-white' : 'bg-slate-800 border-slate-600'}`}></div>
                        <div className="flex-1">
                          <div className="flex items-center justify-between">
                            <span className={`text-xs font-semibold ${isCurrent ? 'text-emerald-400 font-bold' : 'text-slate-200'}`}>
                              {stop.stop_name}
                            </span>
                            {isCurrent && <span className="bg-emerald-500/20 text-emerald-400 text-[9px] px-1.5 py-0.5 rounded font-bold">BUS HERE 🚌</span>}
                            {isCollege && <span className="text-sm">🏫</span>}
                          </div>
                          <p className="text-[10px] text-slate-500 font-mono">Lat: {stop.latitude.toFixed(4)} | Lon: {stop.longitude.toFixed(4)}</p>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>

            <div className="lg:col-span-2 min-h-[500px]">
              <LeafletMap
                busLocation={busLocation}
                routeStops={currentStops}
                busNumber={busId === 2 ? "BUS-12 (NH48 Karad - ABIT Satara)" : "BUS-05 (Kolhapur)"}
              />
            </div>
          </div>
        </div>
      );
    }

    // --- Driver App Component ---
    function DriverApp() {
      const [selectedBusId, setSelectedBusId] = useState(2);
      const [isSimulating, setIsSimulating] = useState(false);
      const [isRealGPS, setIsRealGPS] = useState(false);
      const [speed, setSpeed] = useState(60);
      const [lat, setLat] = useState(17.2833);
      const [lng, setLng] = useState(74.1825);
      const [status, setStatus] = useState('Driver Phone Emitter Ready');
      const wsRef = useRef(null);

      const karadNH48Waypoints = [
        { name: "Karad Central Bus Stand (CBS) 📍", lat: 17.2833, lng: 74.1825 },
        { name: "Karad NH48 Highway Flyover Junction 📍", lat: 17.2915, lng: 74.1780 },
        { name: "Ohar Village NH48 📍", lat: 17.3450, lng: 74.1420 },
        { name: "Umbraj NH48 Flyover Junction 📍", lat: 17.4015, lng: 74.1030 },
        { name: "Chinchani NH48 Stretch 📍", lat: 17.4580, lng: 74.0780 },
        { name: "Kashil Phata NH48 📍", lat: 17.5180, lng: 74.0550 },
        { name: "Nagthane NH48 Flyover 📍", lat: 17.5650, lng: 74.0320 },
        { name: "Varna Phata NH48 📍", lat: 17.6010, lng: 74.0220 },
        { name: "Shendre Fata NH48 Exit (Satara) 📍", lat: 17.6320, lng: 74.0150 },
        { name: "ABIT Polytechnic Satara Campus 🏫", lat: 17.6550, lng: 74.0100 }
      ];

      const activeWaypoints = selectedBusId === 2 ? karadNH48Waypoints : [];

      useEffect(() => {
        wsRef.current = new WebSocket(`${WS_BASE}/driver/${selectedBusId}`);
        wsRef.current.onopen = () => setStatus(`WebSocket Connected for Bus #${selectedBusId}`);
        return () => wsRef.current && wsRef.current.close();
      }, [selectedBusId]);

      const sendGPS = (latitude, longitude, currentSpeed) => {
        const payload = { bus_id: selectedBusId, latitude, longitude, speed: currentSpeed };
        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
          wsRef.current.send(JSON.stringify(payload));
        } else {
          fetch(`${API_BASE}/location`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(payload)
          }).catch(console.error);
        }
      };

      useEffect(() => {
        let interval = null;
        if (isSimulating) {
          let idx = 0;
          interval = setInterval(() => {
            idx = (idx + 1) % activeWaypoints.length;
            const target = activeWaypoints[idx];
            setLat(target.lat);
            setLng(target.lng);
            sendGPS(target.lat, target.lng, speed);
            setStatus(`GPS Stream: ${target.name}`);
          }, 3000);
        }
        return () => clearInterval(interval);
      }, [isSimulating, speed, selectedBusId]);

      const toggleRealGPS = () => {
        if (!isRealGPS && 'geolocation' in navigator) {
          setIsSimulating(false);
          setIsRealGPS(true);
          navigator.geolocation.watchPosition((pos) => {
            const dLat = pos.coords.latitude;
            const dLng = pos.coords.longitude;
            setLat(dLat);
            setLng(dLng);
            sendGPS(dLat, dLng, speed);
            setStatus(`Device GPS Locked: ${dLat.toFixed(4)}, ${dLng.toFixed(4)}`);
          });
        } else {
          setIsRealGPS(false);
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="glass-panel p-5 rounded-xl flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="p-3 bg-cyan-500/20 text-cyan-400 rounded-xl text-2xl">📱</div>
              <div>
                <h2 className="text-xl font-bold text-white">Driver Phone Console (GPS Transmitter)</h2>
                <p className="text-xs text-slate-400">
                  Transmitting Real-time Location to Backend API
                </p>
              </div>
            </div>

            <div>
              <label className="text-[10px] text-slate-400 uppercase font-semibold block">Select Driver Bus</label>
              <select
                value={selectedBusId}
                onChange={(e) => {
                  const bId = Number(e.target.value);
                  setSelectedBusId(bId);
                  if (bId === 2) { setLat(17.2833); setLng(74.1825); }
                  else { setLat(16.7049); setLng(74.2433); }
                }}
                className="bg-slate-900 text-white font-bold text-sm border border-slate-800 rounded-lg px-3 py-1.5 focus:outline-none"
              >
                <option value={2}>Bus #12 (Karad ➔ ABIT Satara)</option>
                <option value={1}>Bus #05 (Kolhapur Route)</option>
              </select>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="glass-panel p-6 rounded-3xl border-4 border-slate-800 shadow-2xl flex flex-col items-center justify-center min-h-[420px] text-center space-y-4">
              <span className="text-xs text-emerald-400 font-mono bg-slate-900 px-3 py-1 rounded-full border border-slate-800">
                GPS TELEMETRY EMITTER
              </span>
              <div>
                <span className="text-xs text-slate-400 block uppercase">Latitude</span>
                <div className="text-3xl font-black text-white font-mono">{lat.toFixed(4)}° N</div>
              </div>
              <div>
                <span className="text-xs text-slate-400 block uppercase">Longitude</span>
                <div className="text-3xl font-black text-cyan-400 font-mono">{lng.toFixed(4)}° E</div>
              </div>
              <div className="p-2 bg-slate-950/80 rounded-xl w-full text-xs text-slate-300 border border-slate-800">{status}</div>
            </div>

            <div className="glass-panel p-6 rounded-xl space-y-5">
              <h3 className="text-lg font-bold text-white">Controls & Simulation</h3>
              <div className="grid grid-cols-2 gap-3">
                <button onClick={()=>setIsSimulating(!isSimulating)} className={`p-3 rounded-xl font-bold text-xs ${isSimulating ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-white'}`}>
                  {isSimulating ? 'Pause Route' : 'Auto Route Simulator'}
                </button>
                <button onClick={toggleRealGPS} className={`p-3 rounded-xl font-bold text-xs ${isRealGPS ? 'bg-cyan-500 text-slate-950' : 'bg-slate-800 text-white'}`}>
                  {isRealGPS ? 'Stop Device GPS' : 'Use Device GPS'}
                </button>
              </div>

              <div className="space-y-2">
                <div className="flex justify-between text-xs text-slate-300">
                  <span>Simulated Driving Speed</span>
                  <span className="font-bold text-emerald-400">{speed} km/h</span>
                </div>
                <input type="range" min="20" max="100" value={speed} onChange={(e)=>setSpeed(Number(e.target.value))} className="w-full accent-emerald-400 bg-slate-800 h-2 rounded-lg" />
              </div>

              <button onClick={()=>sendGPS(lat, lng, speed)} className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold text-xs rounded-lg border border-slate-700">
                Transmit Selected Coordinates Now
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- Admin Panel Component ---
    function AdminPanel() {
      const [buses, setBuses] = useState([]);
      const [historyLogs, setHistoryLogs] = useState([]);
      const [adminTab, setAdminTab] = useState('buses');

      useEffect(() => {
        fetch(`${API_BASE}/buses`).then(r => r.json()).then(setBuses).catch(console.error);
        fetch(`${API_BASE}/buses/2/history`).then(r => r.json()).then(setHistoryLogs).catch(console.error);
      }, []);

      return (
        <div className="space-y-6">
          <div className="glass-panel p-5 rounded-xl flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 className="text-xl font-bold text-white flex items-center gap-2">
                ⚙️ System Administration & Fleet Management Console
              </h2>
              <p className="text-xs text-slate-400 mt-0.5">
                Manage Fleet, Drivers, Routes, and Database Telemetry.
              </p>
            </div>
            
            <a
              href="/static/college-bus-tracker.zip"
              download="college-bus-tracker.zip"
              className="px-3 py-1.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold rounded-lg transition-colors flex items-center gap-1 shadow-lg shadow-emerald-500/20"
            >
              ⬇️ Download Project Zip File
            </a>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="glass-panel p-4 rounded-xl border border-slate-800">
              <span className="text-xs text-slate-400 uppercase font-semibold block">Total Buses</span>
              <div className="text-2xl font-black text-white mt-1">2 <span className="text-xs font-normal text-emerald-400">(Active)</span></div>
            </div>
            <div className="glass-panel p-4 rounded-xl border border-slate-800">
              <span className="text-xs text-slate-400 uppercase font-semibold block">Active Routes</span>
              <div className="text-2xl font-black text-cyan-400 mt-1">2 <span className="text-xs font-normal text-slate-400">(Karad & Kolhapur)</span></div>
            </div>
            <div className="glass-panel p-4 rounded-xl border border-slate-800">
              <span className="text-xs text-slate-400 uppercase font-semibold block">Registered Drivers</span>
              <div className="text-2xl font-black text-emerald-400 mt-1">2 <span className="text-xs font-normal text-slate-400">(Verified)</span></div>
            </div>
            <div className="glass-panel p-4 rounded-xl border border-slate-800">
              <span className="text-xs text-slate-400 uppercase font-semibold block">GPS Telemetry Logs</span>
              <div className="text-2xl font-black text-purple-400 mt-1">{historyLogs.length || 24} <span className="text-xs font-normal text-slate-400">(In DB)</span></div>
            </div>
          </div>

          <div className="flex border-b border-slate-800 text-xs font-bold space-x-6">
            <button onClick={() => setAdminTab('buses')} className={`pb-3 ${adminTab === 'buses' ? 'text-cyan-400 border-b-2 border-cyan-400' : 'text-slate-400'}`}>Fleet Buses</button>
            <button onClick={() => setAdminTab('logs')} className={`pb-3 ${adminTab === 'logs' ? 'text-cyan-400 border-b-2 border-cyan-400' : 'text-slate-400'}`}>Database Logs</button>
          </div>

          {adminTab === 'buses' && (
            <div className="glass-panel p-5 rounded-xl space-y-4">
              <h3 className="font-bold text-white text-base">Fleet Bus Vehicles</h3>
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-900 text-slate-400 uppercase">
                  <tr><th className="p-3">Bus Number</th><th className="p-3">Registration Number</th><th className="p-3">Capacity</th><th className="p-3">Status</th></tr>
                </thead>
                <tbody className="divide-y divide-slate-800 font-mono">
                  <tr><td className="p-3 font-bold text-cyan-400">BUS-12</td><td className="p-3 text-white">MH-11-AB-2012</td><td className="p-3 text-slate-300">48 Seats</td><td className="p-3 text-emerald-400">ACTIVE</td></tr>
                  <tr><td className="p-3 font-bold text-cyan-400">BUS-05</td><td className="p-3 text-white">MH-09-CB-1005</td><td className="p-3 text-slate-300">52 Seats</td><td className="p-3 text-emerald-400">ACTIVE</td></tr>
                </tbody>
              </table>
            </div>
          )}

          {adminTab === 'logs' && (
            <div className="glass-panel p-5 rounded-xl space-y-4">
              <h3 className="font-bold text-white text-base">Database GPS Logs</h3>
              <div className="overflow-x-auto max-h-[350px]">
                <table className="w-full text-left text-xs font-mono">
                  <thead className="bg-slate-900 text-slate-400 uppercase">
                    <tr><th className="p-2">Log ID</th><th className="p-2">Bus ID</th><th className="p-2">Latitude</th><th className="p-2">Longitude</th><th className="p-2">Speed</th></tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800">
                    {historyLogs.map(l => (
                      <tr key={l.id}><td className="p-2 text-slate-500">#{l.id}</td><td className="p-2 text-cyan-400">Bus #{l.bus_id}</td><td className="p-2">{l.latitude}° N</td><td className="p-2">{l.longitude}° E</td><td className="p-2 text-emerald-400">{l.speed} km/h</td></tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- Main App Shell ---
    function App() {
      const [user, setUser] = useState(null);
      const [activeTab, setActiveTab] = useState('student');

      useEffect(() => {
        const token = localStorage.getItem('jwt_token');
        const role = localStorage.getItem('user_role');
        const name = localStorage.getItem('user_name');
        if (token && role) {
          setUser({ role, name });
          if (role === 'driver') setActiveTab('driver');
          else if (role === 'admin') setActiveTab('admin');
          else setActiveTab('student');
        }
      }, []);

      const handleLogout = () => {
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('user_role');
        localStorage.removeItem('user_name');
        setUser(null);
      };

      if (!user) {
        return <LoginPage onLoginSuccess={(u) => {
          setUser(u);
          if (u.role === 'driver') setActiveTab('driver');
          else if (u.role === 'admin') setActiveTab('admin');
          else setActiveTab('student');
        }} />;
      }

      return (
        <div className="min-h-screen flex flex-col">
          <header className="sticky top-0 z-40 glass-panel border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={()=>setActiveTab('student')}>
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-emerald-400 p-0.5 shadow-lg shadow-cyan-500/20">
                  <div className="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center text-xl">🚌</div>
                </div>
                <div>
                  <h1 className="font-extrabold text-lg text-white">COLLEGE BUS <span className="text-cyan-400 font-mono">LIVE TRACKER</span></h1>
                  <p className="text-[10px] text-slate-400 font-mono">Karad to ABIT Polytechnic Satara (NH48)</p>
                </div>
              </div>

              <nav className="flex items-center space-x-2 text-xs">
                <button onClick={() => setActiveTab('student')} className={`px-4 py-2 rounded-lg font-bold ${activeTab==='student' ? 'bg-cyan-500 text-slate-950' : 'text-slate-400'}`}>
                  Student App & Map
                </button>
                <button onClick={() => setActiveTab('driver')} className={`px-4 py-2 rounded-lg font-bold ${activeTab==='driver' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}`}>
                  Driver GPS Terminal
                </button>
                <button onClick={() => setActiveTab('admin')} className={`px-4 py-2 rounded-lg font-bold ${activeTab==='admin' ? 'bg-purple-500 text-white' : 'text-slate-400'}`}>
                  ⚙️ Admin Panel
                </button>

                <a
                  href="/static/college-bus-tracker.zip"
                  download="college-bus-tracker.zip"
                  className="px-3 py-1.5 bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 text-slate-950 font-bold rounded-lg transition-all text-xs flex items-center gap-1 shadow-lg shadow-emerald-500/20 ml-2"
                >
                  <span>⬇️</span> Download Zip
                </a>

                <div className="flex items-center space-x-2 border-l border-slate-800 pl-3 ml-2">
                  <span className="text-xs font-bold text-white">{user.name || 'User'}</span>
                  <button onClick={handleLogout} className="px-2.5 py-1 bg-red-500/20 hover:bg-red-500/30 text-red-400 font-bold rounded-lg text-xs">
                    Logout
                  </button>
                </div>
              </nav>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
            {activeTab === 'student' && <StudentApp />}
            {activeTab === 'driver' && <DriverApp />}
            {activeTab === 'admin' && <AdminPanel />}
          </main>

          <footer className="border-t border-slate-900 py-4 text-center text-xs text-slate-500">
            Karad (17.2833° N, 74.1825° E) ➔ ABIT Polytechnic Satara (17.6550° N, 74.0100° E) via NH48
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
